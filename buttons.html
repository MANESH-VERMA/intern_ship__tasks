<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Button Testing</title>
    <style>
        .button {
            background-color: #4CAF50; /* Green */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease; /* Smooth transition for testing */
        }
        .button:hover {
            background-color: #45a049;
            border-radius: 120px;
            width: 200px;
            height: 60px;
        }
    </style>
</head>
<body>
    <button class="button">Click Me!</button>

    <!-- Linking Testing Script -->
    <script src="script.js"></script>
</body>
</html>
